# Logging for SOTERIA JVMs started from gramine/ (driver and executors).
# Same console output as Spark's default, minus warnings that are expected and
# harmless inside Gramine, so real errors stay visible.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Spark first tries "rm -rf" in a child process (impossible inside Gramine),
# then deletes from Java.
logger.javautils.name = org.apache.spark.network.util.JavaUtils
logger.javautils.level = error

# Gramine does not emulate network-interface listing (SIOCGIFCONF).
logger.nettynet.name = io.netty.util.NetUtilInitializations
logger.nettynet.level = error
logger.nettymac.name = io.netty.util.internal.MacAddressUtil
logger.nettymac.level = error

# Hadoop shutdown hooks time out while waiting for those fallbacks.
logger.hadoopshutdown.name = org.apache.hadoop.util.ShutdownHookManager
logger.hadoopshutdown.level = error
